<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎈 Pop the Balloons! 🎈</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="score-container">
        <div id="score">Score: <span id="score-value">0</span></div>
        <div id="encouragement"></div>
    </div>
    <button id="fullscreen-btn">⛶</button>
    <button id="mute-btn">🔊</button>
    <div id="container">
        <div id="clouds">
            <div class="cloud" style="left: 10%; top: 15%; animation-delay: 0s;"></div>
            <div class="cloud" style="left: 50%; top: 25%; animation-delay: 3s;"></div>
            <div class="cloud" style="left: 80%; top: 10%; animation-delay: 6s;"></div>
        </div>
        <div id="character">
            <div class="character-body">🐻</div>
            <div class="character-arms">🎉</div>
        </div>
    </div>
    
    <!-- Sound Effects - Multiple formats for better compatibility -->
    <audio id="pop-sound-1" preload="auto"></audio>
    <audio id="special-sound" preload="auto"></audio>
    
    <script src="script.js"></script>
</body>
</html>
